---
# Git and pnpm runtime environment for the pd-fade service user
pd_fade_pnpm_environment:
  HOME: "{{ pd_fade_data_dir }}"
  PNPM_HOME: "{{ pd_fade_pnpm_store_dir }}"

pd_fade_git_environment: >-
  {{
    pd_fade_pnpm_environment | combine({
      'GIT_SSH_COMMAND': (
        'ssh -i ' ~ pd_fade_git_ssh_key_path
        ~ ' -o IdentitiesOnly=yes'
        ~ ' -o StrictHostKeyChecking=yes'
        ~ ' -o UserKnownHostsFile=' ~ pd_fade_git_ssh_dir ~ '/known_hosts'
      )
    }) if (pd_fade_git_deploy_key_enabled | bool) else pd_fade_pnpm_environment
  }}
