---
- name: Resolve git SSH host from repository URL
  ansible.builtin.set_fact:
    pd_fade_git_ssh_host: >-
      {{
        (pd_fade_repo_url | regex_replace('^git@([^:]+):.*', '\1'))
        if (pd_fade_repo_url is match('^git@'))
        else (pd_fade_repo_url | regex_replace('^https?://([^/]+)/.*', '\1'))
      }}

- name: Ensure git SSH directory exists
  ansible.builtin.file:
    path: "{{ pd_fade_git_ssh_dir }}"
    state: directory
    owner: "{{ pd_fade_user }}"
    group: "{{ pd_fade_group }}"
    mode: "0700"

- name: Install git deploy key
  ansible.builtin.copy:
    content: "{{ vault_pd_fade_git_deploy_key }}"
    dest: "{{ pd_fade_git_ssh_key_path }}"
    owner: "{{ pd_fade_user }}"
    group: "{{ pd_fade_group }}"
    mode: "0600"
  no_log: true

- name: Fetch git host SSH public keys
  ansible.builtin.command:
    cmd: ssh-keyscan -t rsa,ecdsa,ed25519 {{ pd_fade_git_ssh_host }}
  register: pd_fade_git_host_keyscan
  changed_when: false
  failed_when: >-
    pd_fade_git_host_keyscan.rc != 0
    or pd_fade_git_host_keyscan.stdout | trim == ''

- name: Add git host to known_hosts
  ansible.builtin.known_hosts:
    path: "{{ pd_fade_git_ssh_dir }}/known_hosts"
    name: "{{ pd_fade_git_ssh_host }}"
    key: "{{ pd_fade_git_host_keyscan.stdout }}"
    state: present
  become: true
  become_user: "{{ pd_fade_user }}"
