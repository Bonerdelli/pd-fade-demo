---
- name: Ensure pnpm store directory exists
  ansible.builtin.file:
    path: "{{ pd_fade_pnpm_store_dir }}"
    state: directory
    owner: "{{ pd_fade_user }}"
    group: "{{ pd_fade_group }}"
    mode: "0750"

- name: Ensure application base directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ pd_fade_user }}"
    group: "{{ pd_fade_group }}"
    mode: "0755"
  loop:
    - "{{ pd_fade_app_base }}"
    - "{{ pd_fade_releases_dir }}"

- name: Ensure environment file directory exists
  ansible.builtin.file:
    path: "{{ pd_fade_env_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy server environment file
  ansible.builtin.template:
    src: pd-fade.env.j2
    dest: "{{ pd_fade_env_file }}"
    owner: root
    group: "{{ pd_fade_group }}"
    mode: "0640"
  notify: Restart pd-fade

- name: Deploy systemd unit
  ansible.builtin.template:
    src: pd-fade.service.j2
    dest: "/etc/systemd/system/{{ pd_fade_systemd_unit }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Reload systemd after unit file is present
  ansible.builtin.meta: flush_handlers

- name: Build release archive on controller
  ansible.builtin.import_tasks: build-local.yml

- name: Deploy release to target host
  ansible.builtin.import_tasks: deploy-release.yml

- name: Enable and start pd-fade service
  ansible.builtin.systemd:
    name: "{{ pd_fade_systemd_unit }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Apply service restart after environment changes
  ansible.builtin.meta: flush_handlers

- name: Verify pd-fade health endpoint
  ansible.builtin.import_tasks: healthcheck.yml
