---
- name: Ensure pnpm store directory exists
  ansible.builtin.file:
    path: "{{ pd_fade_pnpm_store_dir }}"
    state: directory
    owner: "{{ pd_fade_user }}"
    group: "{{ pd_fade_group }}"
    mode: "0750"

- name: Ensure application base directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ pd_fade_user }}"
    group: "{{ pd_fade_group }}"
    mode: "0755"
  loop:
    - "{{ pd_fade_app_base }}"
    - "{{ pd_fade_releases_dir }}"

- name: Ensure environment file directory exists
  ansible.builtin.file:
    path: "{{ pd_fade_env_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy server environment file
  ansible.builtin.template:
    src: pd-fade.env.j2
    dest: "{{ pd_fade_env_file }}"
    owner: root
    group: "{{ pd_fade_group }}"
    mode: "0640"
  register: pd_fade_env_deploy

- name: Deploy systemd unit
  ansible.builtin.template:
    src: pd-fade.service.j2
    dest: "/etc/systemd/system/{{ pd_fade_systemd_unit }}.service"
    owner: root
    group: root
    mode: "0644"
  register: pd_fade_unit_deploy

- name: Reload systemd after unit file change
  ansible.builtin.systemd:
    daemon_reload: true
  when: pd_fade_unit_deploy.changed | bool

- name: Build release archive on controller
  ansible.builtin.import_tasks: build-local.yml

- name: Deploy release to target host
  ansible.builtin.import_tasks: deploy-release.yml

- name: Apply pd-fade service state after deploy
  ansible.builtin.systemd:
    name: "{{ pd_fade_systemd_unit }}"
    enabled: true
    state: "{{ 'restarted' if pd_fade_service_restart_required else 'started' }}"
    daemon_reload: false
  vars:
    pd_fade_service_restart_required: >-
      {{
        (pd_fade_release_deployed | default(false) | bool)
        or (pd_fade_env_deploy.changed | default(false) | bool)
        or (pd_fade_unit_deploy.changed | default(false) | bool)
      }}

- name: Verify pd-fade health endpoint
  ansible.builtin.import_tasks: healthcheck.yml
