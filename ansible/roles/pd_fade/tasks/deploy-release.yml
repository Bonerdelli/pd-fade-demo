---
- name: Stat currently deployed release checksum
  ansible.builtin.stat:
    path: "{{ pd_fade_current_link }}/.release-checksum"
  register: pd_fade_deployed_checksum_stat

- name: Read currently deployed release checksum
  ansible.builtin.slurp:
    src: "{{ pd_fade_current_link }}/.release-checksum"
  register: pd_fade_deployed_checksum_slurp
  when: pd_fade_deployed_checksum_stat.stat.exists | default(false)

- name: Decide whether release upload is required
  ansible.builtin.set_fact:
    pd_fade_release_upload_required: >-
      {{
        not (pd_fade_deployed_checksum_stat.stat.exists | default(false))
        or (
          pd_fade_deployed_checksum_slurp.content | b64decode | trim
          != pd_fade_release_checksum | trim
        )
      }}

- name: Skip release upload when checksum matches deployed release
  ansible.builtin.debug:
    msg: >-
      Skipping release upload/deploy — checksum {{ pd_fade_release_checksum }}
      already deployed at {{ pd_fade_current_link }}.
  when: not (pd_fade_release_upload_required | bool)

- name: Deploy new release archive
  when: pd_fade_release_upload_required | bool
  block:
    - name: Upload release archive
      ansible.builtin.copy:
        src: "{{ pd_fade_release_archive }}"
        dest: "/tmp/pd-fade-{{ pd_fade_release_id }}.tar.gz"
        mode: "0644"

    - name: Create release directory
      ansible.builtin.file:
        path: "{{ pd_fade_releases_dir }}/{{ pd_fade_release_id }}"
        state: directory
        owner: "{{ pd_fade_user }}"
        group: "{{ pd_fade_group }}"
        mode: "0755"

    - name: Unpack release archive
      ansible.builtin.unarchive:
        src: "/tmp/pd-fade-{{ pd_fade_release_id }}.tar.gz"
        dest: "{{ pd_fade_releases_dir }}/{{ pd_fade_release_id }}"
        remote_src: true
        owner: "{{ pd_fade_user }}"
        group: "{{ pd_fade_group }}"

    - name: Install production dependencies on target (native modules rebuilt for Linux)
      block:
        - name: Run pnpm install for the server workspace
          ansible.builtin.command:
            argv:
              - timeout
              - --signal=KILL
              - "{{ pd_fade_pnpm_install_timeout_sec }}"
              - corepack
              - "pnpm@{{ pd_fade_pnpm_version }}"
              - install
              - --frozen-lockfile
              - --prod
              - --filter
              - "@pd-fade/server..."
              - --store-dir
              - "{{ pd_fade_pnpm_store_dir }}"
              - --reporter=append-only
          args:
            chdir: "{{ pd_fade_releases_dir }}/{{ pd_fade_release_id }}"
          environment:
            CI: "true"
            COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
            JOBS: "1"
            MAKEFLAGS: "-j1"
            npm_config_jobs: "1"
          register: pd_fade_target_pnpm_install
          changed_when: true

      rescue:
        - name: Collect kernel log for OOM traces
          ansible.builtin.command:
            argv:
              - dmesg
              - -T
          register: pd_fade_dmesg
          changed_when: false
          failed_when: false

        - name: Remove failed release tree so the next run retries cleanly
          ansible.builtin.file:
            path: "{{ pd_fade_releases_dir }}/{{ pd_fade_release_id }}"
            state: absent

        - name: Remove leftover upload archive
          ansible.builtin.file:
            path: "/tmp/pd-fade-{{ pd_fade_release_id }}.tar.gz"
            state: absent

        - name: Fail with pnpm install diagnostics
          ansible.builtin.fail:
            msg: |
              pnpm install failed for release {{ pd_fade_release_id }}.
              rc={{ ansible_failed_result.rc | default('unknown') }}
              (rc 124 = timed out after {{ pd_fade_pnpm_install_timeout_sec }}s)

              --- stdout (tail) ---
              {{ (ansible_failed_result.stdout | default('(empty)'))[-4000:] }}

              --- stderr (tail) ---
              {{ (ansible_failed_result.stderr | default('(empty)'))[-4000:] }}

              --- dmesg OOM ---
              {{
                (
                  pd_fade_dmesg.stdout_lines
                  | default([])
                  | select('search', 'Out of memory|Killed process|oom-kill|cc1')
                  | list
                )[-20:]
                | join('\n')
                | default('(none)', true)
              }}

              If cc/cc1 was Killed, the VM ran out of RAM compiling better-sqlite3.
              Re-run the playbook so the base role can enable swap, or use a host with >=1GB RAM.

    - name: Restore release ownership after pnpm install
      ansible.builtin.command:
        argv:
          - chown
          - -R
          - "{{ pd_fade_user }}:{{ pd_fade_group }}"
          - "{{ pd_fade_releases_dir }}/{{ pd_fade_release_id }}"
      changed_when: true

    - name: Write release checksum marker
      ansible.builtin.copy:
        dest: "{{ pd_fade_releases_dir }}/{{ pd_fade_release_id }}/.release-checksum"
        content: "{{ pd_fade_release_checksum | trim }}\n"
        owner: "{{ pd_fade_user }}"
        group: "{{ pd_fade_group }}"
        mode: "0644"

    - name: Point current release symlink
      ansible.builtin.file:
        src: "{{ pd_fade_releases_dir }}/{{ pd_fade_release_id }}"
        dest: "{{ pd_fade_current_link }}"
        state: link
        owner: "{{ pd_fade_user }}"
        group: "{{ pd_fade_group }}"
        force: true

    - name: Remove uploaded temporary archive
      ansible.builtin.file:
        path: "/tmp/pd-fade-{{ pd_fade_release_id }}.tar.gz"
        state: absent

    - name: Mark release as deployed in this run
      ansible.builtin.set_fact:
        pd_fade_release_deployed: true

- name: Record that no new release was deployed
  ansible.builtin.set_fact:
    pd_fade_release_deployed: false
  when: not (pd_fade_release_upload_required | bool)

- name: Prune old releases
  ansible.builtin.import_tasks: prune-releases.yml
