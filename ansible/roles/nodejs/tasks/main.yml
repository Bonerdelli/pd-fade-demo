---
- name: Check whether NodeSource APT source is configured
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/nodesource.list
  register: nodesource_apt_source

- name: Download NodeSource setup script
  ansible.builtin.get_url:
    url: "https://deb.nodesource.com/setup_{{ nodejs_major_version }}.x"
    dest: /tmp/nodesource_setup.sh
    mode: "0755"
  when: not nodesource_apt_source.stat.exists

- name: Run NodeSource setup script
  ansible.builtin.command: /tmp/nodesource_setup.sh
  when: not nodesource_apt_source.stat.exists
  changed_when: true

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true

- name: Enable corepack
  ansible.builtin.command: corepack enable
  environment:
    CI: "true"
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  changed_when: false

- name: Activate pnpm via corepack
  ansible.builtin.command: "corepack prepare pnpm@{{ pd_fade_pnpm_version }} --activate"
  environment:
    CI: "true"
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  register: corepack_pnpm
  changed_when: "'Already downloaded' not in corepack_pnpm.stdout"

- name: Verify node version
  ansible.builtin.command: node --version
  changed_when: false

- name: Verify pnpm version
  ansible.builtin.command: pnpm --version
  changed_when: false
