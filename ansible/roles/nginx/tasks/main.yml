---
- name: Install nginx and certbot
  ansible.builtin.apt:
    name:
      - nginx
      - certbot
    state: present
    update_cache: true

- name: Ensure certbot webroot exists
  ansible.builtin.file:
    path: "{{ certbot_webroot_path }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Check if TLS certificate exists
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ root_domain }}/fullchain.pem"
  register: pd_fade_cert_check
  when: pd_fade_tls_enabled | bool

- name: Record whether TLS certificate is present
  ansible.builtin.set_fact:
    pd_fade_cert_exists: "{{ pd_fade_cert_check.stat.exists | default(false) }}"
  when: pd_fade_tls_enabled | bool

- name: Assume no TLS certificate when TLS is disabled
  ansible.builtin.set_fact:
    pd_fade_cert_exists: false
  when: not (pd_fade_tls_enabled | bool)

- name: Deploy pd-fade vhost
  ansible.builtin.template:
    src: vhost-pd-fade.conf.j2
    dest: /etc/nginx/sites-available/pd-fade.conf
    mode: "0644"
  notify: Reload nginx

- name: Enable pd-fade vhost
  ansible.builtin.file:
    src: /etc/nginx/sites-available/pd-fade.conf
    dest: /etc/nginx/sites-enabled/pd-fade.conf
    state: link
  notify: Reload nginx

- name: Enable and start nginx
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true
    daemon_reload: true

- name: Apply nginx vhost before certificate request
  ansible.builtin.meta: flush_handlers
  when:
    - pd_fade_tls_enabled | bool
    - letsencrypt_email is defined
    - not (pd_fade_cert_exists | default(false) | bool)

- name: Obtain or renew certificate via webroot
  when:
    - pd_fade_tls_enabled | bool
    - letsencrypt_email is defined
    - not (pd_fade_cert_exists | default(false) | bool)
  block:
    - name: Request Let's Encrypt certificate (webroot)
      ansible.builtin.command: >
        certbot certonly --webroot --non-interactive --agree-tos
        --webroot-path {{ certbot_webroot_path }}
        --email {{ letsencrypt_email }}
        -d {{ root_domain }}
      register: certbot_webroot_result
      changed_when: certbot_webroot_result.rc == 0

    - name: Mark TLS certificate as present after issuance
      ansible.builtin.set_fact:
        pd_fade_cert_exists: true
      when: certbot_webroot_result.rc == 0

    - name: Redeploy pd-fade vhost with HTTPS
      ansible.builtin.template:
        src: vhost-pd-fade.conf.j2
        dest: /etc/nginx/sites-available/pd-fade.conf
        mode: "0644"
      when: certbot_webroot_result.rc == 0
      notify: Reload nginx

    - name: Apply HTTPS nginx vhost after certificate issuance
      ansible.builtin.meta: flush_handlers
      when: certbot_webroot_result.rc == 0

  rescue:
    - name: Report certificate issuance failure
      ansible.builtin.debug:
        msg: >-
          Let's Encrypt certificate request failed; nginx remains on HTTP.
          Fix DNS or webroot reachability, then re-run with tag nginx.

  always:
    - name: Ensure nginx is running after certificate attempt
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: true

- name: Set up certbot auto-renewal
  ansible.builtin.cron:
    name: certbot-renew-pd-fade
    job: "certbot renew --quiet --post-hook 'systemctl reload nginx'"
    minute: "0"
    hour: "3"
    weekday: "1"
    user: root
  when: pd_fade_tls_enabled | bool
