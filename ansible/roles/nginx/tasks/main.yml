---
- name: Install nginx
  ansible.builtin.apt:
    name:
      - nginx
    state: present
    update_cache: true

- name: Remove certbot (TLS is terminated at Cloudflare)
  ansible.builtin.apt:
    name:
      - certbot
    state: absent

- name: Remove leftover certbot renewal cron
  ansible.builtin.cron:
    name: certbot-renew-pd-fade
    state: absent
    user: root

- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Deploy pd-fade vhost
  ansible.builtin.template:
    src: vhost-pd-fade.conf.j2
    dest: /etc/nginx/sites-available/pd-fade.conf
    mode: "0644"
  notify: Reload nginx

- name: Enable pd-fade vhost
  ansible.builtin.file:
    src: /etc/nginx/sites-available/pd-fade.conf
    dest: /etc/nginx/sites-enabled/pd-fade.conf
    state: link
  notify: Reload nginx

- name: Enable and start nginx
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true
    daemon_reload: true
