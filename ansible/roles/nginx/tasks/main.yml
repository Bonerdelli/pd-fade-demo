---
- name: Install nginx and certbot
  ansible.builtin.apt:
    name:
      - nginx
      - certbot
      - python3-certbot-nginx
    state: present
    update_cache: true

- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Deploy pd-fade vhost
  ansible.builtin.template:
    src: vhost-pd-fade.conf.j2
    dest: /etc/nginx/sites-available/pd-fade.conf
    mode: "0644"
  notify: Reload nginx

- name: Enable pd-fade vhost
  ansible.builtin.file:
    src: /etc/nginx/sites-available/pd-fade.conf
    dest: /etc/nginx/sites-enabled/pd-fade.conf
    state: link
  notify: Reload nginx

- name: Check if TLS certificate exists
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ root_domain }}/fullchain.pem"
  register: pd_fade_cert_check
  when: pd_fade_tls_enabled | bool

- name: Stop nginx for initial certificate acquisition
  ansible.builtin.systemd:
    name: nginx
    state: stopped
  when:
    - pd_fade_tls_enabled | bool
    - letsencrypt_email is defined
    - not (pd_fade_cert_check.stat.exists | default(false))

- name: Obtain initial certificate (standalone)
  ansible.builtin.command: >
    certbot certonly --standalone --non-interactive --agree-tos
    --email {{ letsencrypt_email }}
    -d {{ root_domain }}
  when:
    - pd_fade_tls_enabled | bool
    - letsencrypt_email is defined
    - not (pd_fade_cert_check.stat.exists | default(false))
  register: certbot_result
  changed_when: certbot_result.rc == 0
  notify: Restart nginx

- name: Enable and start nginx
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true

- name: Set up certbot auto-renewal
  ansible.builtin.cron:
    name: certbot-renew-pd-fade
    job: "certbot renew --quiet --post-hook 'systemctl reload nginx'"
    minute: "0"
    hour: "3"
    weekday: "1"
    user: root
  when: pd_fade_tls_enabled | bool
