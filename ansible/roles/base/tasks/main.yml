---
- name: Install base prerequisite packages
  ansible.builtin.apt:
    name: "{{ pd_fade_base_prereq_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ pd_fade_base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Create pd-fade system group
  ansible.builtin.group:
    name: "{{ pd_fade_group }}"
    system: true
    state: present

- name: Create pd-fade system user
  ansible.builtin.user:
    name: "{{ pd_fade_user }}"
    group: "{{ pd_fade_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ pd_fade_data_dir }}"
    create_home: false
    state: present

- name: Ensure persistent data directory exists
  ansible.builtin.file:
    path: "{{ pd_fade_data_dir }}"
    state: directory
    owner: "{{ pd_fade_user }}"
    group: "{{ pd_fade_group }}"
    mode: "0750"

- name: Ensure application base directory exists
  ansible.builtin.file:
    path: "{{ pd_fade_app_base }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
